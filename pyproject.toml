[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-bookmark-sync"
version = "1.0.0"
description = "Incrementally archive X bookmarks with the official xurl CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Guido Schmitz"}]
keywords = ["x", "twitter", "bookmarks", "obsidian", "archive", "xurl"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/guidsen/x-bookmark-sync"
Issues = "https://github.com/guidsen/x-bookmark-sync/issues"

[project.scripts]
x-bookmark-sync = "x_bookmark_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
